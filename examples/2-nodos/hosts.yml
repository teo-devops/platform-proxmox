# Inventario de ejemplo: 2 nodos pequeños (laboratorio o pyme con dos servidores).
# Copia la carpeta a inventory/<tu-entorno>/ y cambia los valores: `make check ENV=<tu-entorno>`.
# Referencia de cada campo: docs/inventario.md
all:
  children:
    pve_nodes:
      hosts:
        # El PRIMER nodo crea el cluster; el resto se une a el, en este orden.
        pve1:
          ansible_host: 192.168.10.11
          pve_nic: nic0                  # NIC fisica del bridge (nombre en el SO instalado)
          pve_mac: "aa:bb:cc:00:00:11"   # opcional: elige la NIC en el instalador desatendido
          pve_disks: [nvme0n1]           # discos donde se instala Proxmox
          pve_expect: {cpu_threads: 8, ram_gib: 32, disk_gib: 450}   # minimos de preflight
        pve2:
          ansible_host: 192.168.10.12
          pve_nic: nic0
          pve_mac: "aa:bb:cc:00:00:12"
          pve_disks: [nvme0n1]
          pve_expect: {cpu_threads: 8, ram_gib: 32, disk_gib: 450}
