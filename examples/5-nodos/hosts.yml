# Inventario de ejemplo: 5 nodos con dos discos en espejo, dos NIC en bond para
# gestion y VMs, y una red dedicada para corosync (link1). Referencia: docs/inventario.md
all:
  children:
    pve_nodes:
      hosts:
        pve01:
          ansible_host: 10.30.0.11
          pve_nic: bond0
          pve_bond: {slaves: [nic0, nic1], mode: active-backup}
          pve_disks: [sda, sdb]          # 2 discos -> ZFS raid1 (espejo)
          pve_corosync_link1: {nic: nic2, ip: 10.31.0.11}
          pve_expect: {cpu_threads: 48, ram_gib: 250, disk_gib: 900}
          bmc: {host: 10.30.8.11}
        pve02:
          ansible_host: 10.30.0.12
          pve_nic: bond0
          pve_bond: {slaves: [nic0, nic1], mode: active-backup}
          pve_disks: [sda, sdb]
          pve_corosync_link1: {nic: nic2, ip: 10.31.0.12}
          pve_expect: {cpu_threads: 48, ram_gib: 250, disk_gib: 900}
          bmc: {host: 10.30.8.12}
        pve03:
