# Ansible de platform-proxmox. Se usa a traves del Makefile (`make help`), que pasa
# el inventario (-i inventory/<ENV>) y el known_hosts de ese entorno.
[defaults]
roles_path = ansible/roles
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
# Los nodos se gestionan como root (la clave de root la pone el instalador:
# install.root_ssh_keys). Proxmox no tiene otro usuario con privilegios por defecto.
remote_user = root
forks = 10

[ssh_connection]
pipelining = True
